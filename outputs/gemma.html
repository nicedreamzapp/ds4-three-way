<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Aurora Borealis</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #02040a;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>

    <script>
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        let time = 0;

        // Aurora configuration
        const auroraBands = [
            { color: { h: 140, s: 80, l: 50 }, offset: 0, speed: 0.002, amplitude: 40 }, // Green
            { color: { h: 170, s: 80, l: 50 }, offset: 2, speed: 0.0015, amplitude: 30 }, // Teal
            { color: { h: 280, s: 70, l: 60 }, offset: 4, speed: 0.0025, amplitude: 50 }, // Violet
            { color: { h: 320, s: 70, l: 60 }, offset: 6, speed: 0.0018, amplitude: 40 }, // Magenta
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 250; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 0.7,
                    size: Math.random() * 1.5,
                    opacity: Math.random(),
                    twinkle: Math.random() * Math.PI
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = "white";
            stars.forEach(s => {
                const alpha = 0.3 + Math.abs(Math.sin(time * 0.01 + s.twinkle)) * 0.7;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawAurora() {
            const gradientCount = 4;
            const step = width / 60;

            auroraBands.forEach((band, idx) => {
                ctx.beginPath();
                ctx.lineWidth = 40 + Math.sin(time * 0.001 + idx) * 20;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // Create a glowing gradient for the band
                const grad = ctx.createLinearGradient(0, height * 0.2, 0, height * 0.6);
                grad.addColorStop(0, `hsla(${band.color.h}, ${band.color.s}%, ${band.color.l}%, 0)`);
                grad.addColorStop(0.5, `hsla(${band.color.h}, ${band.color.s}%, ${band.color.l}%, 0.4)`);
                grad.addColorStop(1, `hsla(${band.color.h}, ${band.color.s}%, ${band.color.l}%, 0)`);
                
                ctx.strokeStyle = grad;
                ctx.shadowBlur = 30;
                ctx.shadowColor = `hsla(${band.color.h}, ${band.color.s}%, ${band.color.l}%, 0.5)`;

                ctx.moveTo(0, height * 0.5);

                for (let x = 0; x <= width; x += step) {
                    const noise = Math.sin(x * 0.002 + (time * band.speed * 10) + band.offset) * band.amplitude;
                    const noise2 = Math.cos(x * 0.005 - (time * band.speed * 5)) * 20;
                    const y = height * 0.4 + noise + noise2;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            });
            ctx.shadowBlur = 0;
        }

        function drawMountain() {
            // Calculate current dominant aurora color for the rim light
            const activeBand = auroraBands[Math.floor((time * 0.0005) % auroraBands.length)];
            const rimColor = `hsla(${activeBand.color.h}, ${activeBand.color.s}%, ${activeBand.color.l}%, 0.3)`;

            ctx.fillStyle = "#05070a";
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.7);
            
            // Jagged peaks
            const peaks = [
                {x: 0.2, y: 0.5}, {x: 0.35, y: 0.65}, {x: 0.5, y: 0.4}, 
                {x: 0.65, y: 0.6}, {x: 0.8, y: 0.55}, {x: 1.0, y: 0.7}
            ];

            peaks.forEach(p => {
                ctx.lineTo(p.x * width, p.y * height);
            });
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();

            // Rim light effect
            ctx.strokeStyle = rimColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw scattered pine trees
            for(let i = 0; i < 15; i++) {
                const tx = (i * 0.07 + 0.1) * width;
                const ty = height * 0.7 + Math.sin(i) * 50;
                drawTree(tx, ty, 20 + Math.random() * 30);
            }
        }

        function drawTree(x, y, size) {
            ctx.fillStyle = "#05070a";
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - size * 0.2, y);
            ctx.lineTo(x, y - size);
            ctx.lineTo(x + size * 0.2, y);
            ctx.closePath();
            ctx.fill();
            
            // Subtle glow on tree tips
            const activeBand = auroraBands[Math.floor((time * 0.0005) % auroraBands.length)];
            ctx.fillStyle = `hsla(${activeBand.color.h}, ${activeBand.color.s}%, ${activeBand.color.l}%, 0.2)`;
            ctx.beginPath();
            ctx.arc(x, y - size, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            time++;
            // Clear with a slight fade for motion blur effect
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = "#02040a";
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'lighter';
            drawStars();
            drawAurora();
            
            ctx.globalCompositeOperation = 'source-over';
            drawMountain();

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
