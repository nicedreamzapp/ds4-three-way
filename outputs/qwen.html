<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northern Lights</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .title {
            position: relative;
            z-index: 2;
            color: white;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        
        p {
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <canvas id="auroraCanvas"></canvas>
    <div class="title">
        <h1>NORTHERN LIGHTS</h1>
        <p>Cinematic Aurora Simulation</p>
    </div>

    <script>
        const canvas = document.getElementById('auroraCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas to full window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Starfield
        const stars = [];
        const starCount = 500;
        
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height * 0.6,
                size: Math.random() * 1.5,
                opacity: Math.random() * 0.8 + 0.2,
                twinkleSpeed: Math.random() * 0.02 + 0.005,
                twinklePhase: Math.random() * Math.PI * 2
            });
        }
        
        // Mountain silhouette
        const mountains = [];
        const mountainCount = 8;
        
        for (let i = 0; i < mountainCount; i++) {
            const baseHeight = canvas.height * 0.6 + Math.random() * 50;
            const peakHeight = baseHeight - 50 - Math.random() * 100;
            const width = canvas.width / (mountainCount + 1);
            const x = (i + 1) * width;
            
            mountains.push({
                x: x,
                baseHeight: baseHeight,
                peakHeight: peakHeight,
                width: width,
                points: []
            });
            
            // Generate jagged peaks
            const segments = 8;
            for (let j = 0; j <= segments; j++) {
                const segmentX = (j / segments) * width;
                const peakOffset = Math.sin(j * 0.8) * 20;
                mountains[i].points.push({
                    x: segmentX,
                    y: baseHeight - peakOffset
                });
            }
        }
        
        // Pine trees
        const trees = [];
        const treeCount = 30;
        
        for (let i = 0; i < treeCount; i++) {
            const mountainIndex = Math.floor(Math.random() * mountainCount);
            const mountain = mountains[mountainIndex];
            const x = mountain.x + Math.random() * mountain.width;
            const height = mountain.baseHeight - 30 - Math.random() * 50;
            
            trees.push({
                x: x,
                y: height,
                size: Math.random() * 15 + 10,
                mountainIndex: mountainIndex
            });
        }
        
        // Aurora colors
        const auroraColors = [
            'rgba(0, 255, 100, 0.7)',   // Green
            'rgba(0, 200, 200, 0.7)',   // Teal
            'rgba(200, 0, 200, 0.7)',   // Magenta
            'rgba(150, 0, 255, 0.7)'    // Violet
        ];
        
        // Aurora animation
        let time = 0;
        const auroraLayers = [];
        const layerCount = 5;
        
        for (let i = 0; i < layerCount; i++) {
            auroraLayers.push({
                speed: 0.002 + Math.random() * 0.003,
                amplitude: 20 + Math.random() * 30,
                frequency: 0.005 + Math.random() * 0.01,
                colorIndex: Math.floor(Math.random() * auroraColors.length)
            });
        }
        
        // Draw starfield
        function drawStars() {
            ctx.fillStyle = 'white';
            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                const opacity = star.opacity * (0.5 + Math.sin(time * star.twinkleSpeed + star.twinklePhase) * 0.5);
                ctx.globalAlpha = opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        
        // Draw mountains
        function drawMountains() {
            // Draw base mountains
            ctx.fillStyle = '#1a1a2e';
            for (let i = 0; i < mountains.length; i++) {
                const mountain = mountains[i];
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                ctx.lineTo(mountain.x, mountain.baseHeight);
                
                for (let j = 0; j < mountain.points.length; j++) {
                    const point = mountain.points[j];
                    ctx.lineTo(mountain.x + point.x, point.y);
                }
                
                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fill();
            }
            
            // Draw mountain glow from aurora
            for (let i = 0; i < mountains.length; i++) {
                const mountain = mountains[i];
                const glowIntensity = Math.sin(time * 0.005 + i) * 0.3 + 0.7;
                
                ctx.fillStyle = `rgba(0, 255, 100, ${glowIntensity * 0.1})`;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                ctx.lineTo(mountain.x, mountain.baseHeight);
                
                for (let j = 0; j < mountain.points.length; j++) {
                    const point = mountain.points[j];
                    ctx.lineTo(mountain.x + point.x, point.y);
                }
                
                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fill();
            }
        }
        
        // Draw pine trees
        function drawTrees() {
            for (let i = 0; i < trees.length; i++) {
                const tree = trees[i];
                const mountain = mountains[tree.mountainIndex];
                
                // Tree trunk
                ctx.fillStyle = '#5d4037';
                ctx.fillRect(tree.x - 3, tree.y + 10, 6, 20);
                
                // Tree foliage
                ctx.fillStyle = '#2e7d32';
                ctx.beginPath();
                ctx.moveTo(tree.x, tree.y);
                ctx.lineTo(tree.x - tree.size, tree.y + 30);
                ctx.lineTo(tree.x + tree.size, tree.y + 30);
                ctx.closePath();
                ctx.fill();
                
                // Tree glow from aurora
                const glowIntensity = Math.sin(time * 0.003 + i) * 0.4 + 0.6;
                ctx.fillStyle = `rgba(0, 255, 100, ${glowIntensity * 0.1})`;
                ctx.beginPath();
                ctx.moveTo(tree.x, tree.y);
                ctx.lineTo(tree.x - tree.size, tree.y + 30);
                ctx.lineTo(tree.x + tree.size, tree.y + 30);
                ctx.closePath();
                ctx.fill();
            }
        }
        
        // Draw aurora
        function drawAurora() {
            const auroraHeight = canvas.height * 0.4;
            const startY = canvas.height * 0.2;
            
            for (let i = 0; i < auroraLayers.length; i++) {
                const layer = auroraLayers[i];
                const color = auroraColors[layer.colorIndex];
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(0, startY);
                
                for (let x = 0; x < canvas.width; x += 5) {
                    const y = startY + Math.sin(x * layer.frequency + time * layer.speed) * layer.amplitude;
                    ctx.lineTo(x, y);
                }
                
                ctx.lineTo(canvas.width, canvas.height * 0.8);
                ctx.lineTo(0, canvas.height * 0.8);
                ctx.closePath();
                ctx.fill();
                
                // Add glow effect
                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        
        // Main animation loop
        function animate() {
            // Clear canvas with a dark blue background
            ctx.fillStyle = '#0a0a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            time += 0.5;
            
            // Draw all elements
            drawStars();
            drawMountains();
            drawTrees();
            drawAurora();
            
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
    </script>
</body>
</html>
