<!doctype html>
<html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0a0a14; color: #f0f0f0; font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
.wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 0 80px; text-align: center; }
.headline { font-size: 70px; font-weight: 700; letter-spacing: -1px; line-height: 1.05; margin-bottom: 40px; }
.headline .accent { color: #6cf; }
.row { display: flex; gap: 60px; margin: 30px 0; }
.cell { padding: 24px 32px; background: #11122a; border-radius: 18px; border: 1px solid #2a2c55; min-width: 270px; }
.cell h3 { font-size: 20px; margin-bottom: 14px; color: #fff; }
.cell .num { font-size: 40px; font-weight: 700; color: #6f6; margin-bottom: 4px; }
.cell.purple .num { color: #d6f; }
.cell.blue .num { color: #6bf; }
.cell .label { color: #888; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
.tag { margin-top: 50px; color: #888; font-size: 18px; letter-spacing: 4px; text-transform: uppercase; }
</style></head>
<body>
<div class="wrap">
  <div class="headline">Three glowing skies <span class="accent">on one MacBook</span>.</div>
  <div class="row">
    <div class="cell"><h3>DeepSeek V4 Flash</h3><div class="num">103 s</div><div class="label">3,259 tokens · local · ds4.c</div></div>
    <div class="cell purple"><h3>Cloud Claude</h3><div class="num">192 s</div><div class="label">~3,500 tokens · max plan</div></div>
    <div class="cell blue"><h3>Gemma 4 31B</h3><div class="num">131 s</div><div class="label">1,992 tokens · MLX local</div></div>
  </div>
  <div class="tag">Same prompt · Different engines · Apple Silicon</div>
</div>
</body></html>
