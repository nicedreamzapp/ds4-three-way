<!doctype html>
<html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0a0a14; color: #f0f0f0; font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
.wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 0 80px; text-align: center; }
.kicker { color: #888; font-size: 22px; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 30px; }
.title { font-size: 84px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.05; margin-bottom: 36px; }
.title .accent { color: #6cf; }
.engines { font-size: 30px; color: #aaa; letter-spacing: 1px; }
.engines b { color: #f5f5f5; font-weight: 600; }
.dot { color: #444; margin: 0 18px; }
.date { margin-top: 50px; color: #6cf; font-size: 18px; letter-spacing: 4px; text-transform: uppercase; }
</style></head>
<body>
<div class="wrap">
  <div class="kicker">Three Engines · One Prompt · One Laptop</div>
  <div class="title">Local AI <span class="accent">caught up</span><br/>on May 9, 2026.</div>
  <div class="engines">
    <b>DeepSeek V4 Flash</b> <span class="dot">·</span>
    <b>Cloud Claude</b> <span class="dot">·</span>
    <b>Gemma 4 31B</b>
  </div>
  <div class="date">Apple Silicon — 128 GB RAM</div>
</div>
</body></html>
